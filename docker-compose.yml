version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: resilience-postgres
    environment:
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: resilience
      POSTGRES_DB: resilience
    ports:
      - "5445:5432"
    volumes:
      - resilience-pg-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilience -d resilience"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resilience-redis
    ports:
      - "6401:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-provider-a:
    build:
      context: .
      dockerfile: Dockerfile.mockprovider
    container_name: resilience-provider-a
    environment:
      PROVIDER_NAME: provider-a
      LISTEN_ADDR: ":9001"
    ports:
      - "9001:9001"

  mock-provider-b:
    build:
      context: .
      dockerfile: Dockerfile.mockprovider
    container_name: resilience-provider-b
    environment:
      PROVIDER_NAME: provider-b
      LISTEN_ADDR: ":9002"
    ports:
      - "9002:9002"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: resilience-api
    depends_on:
      - postgres
      - redis
      - mock-provider-a
      - mock-provider-b
    environment:
      HTTP_ADDR: ":8090"
      POSTGRES_DSN: "postgres://resilience:resilience@postgres:5432/resilience?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      PROVIDER_A_URL: "http://mock-provider-a:9001/health"
      PROVIDER_B_URL: "http://mock-provider-b:9002/health"
    ports:
      - "8090:8090"

  prometheus:
    image: prom/prometheus:latest
    container_name: resilience-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: resilience-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3004:3000"
    depends_on:
      - prometheus

volumes:
  resilience-pg-data:
